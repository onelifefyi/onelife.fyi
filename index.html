<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoorv</title>
    <style>
        :root {
            --bg: #fffcf9; /* Warm paper */
            --text: #2a2a2a;
            --meta: #999;
            --font-body: "Georgia", "Times New Roman", serif;
            --font-mono: "SF Mono", "Monaco", "Courier New", monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* Aligns text to the left */
            padding: 0 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .site-id {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--meta);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: normal;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.25rem;
            color: #444;
            margin: 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="site-id">onelife.fyi</div>
    
    <h1>Hi, I'm Apoorv.</h1>
    
    <p>I don't have it all figured out yet.</p>

</body>
</html>
